# GitLab CI mirrors .github/workflows/ci.yml (ruff, mypy, unittest on 3.11/3.12).
# Symlink checkout to a `Cozter` dir on PYTHONPATH so `from Cozter...` imports resolve.

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

stages:
  - test

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  before_script:
    - COZTER_LINK_DIR="$(mktemp -d)"
    - ln -s "$CI_PROJECT_DIR" "$COZTER_LINK_DIR/Cozter"
    - export PYTHONPATH="$COZTER_LINK_DIR"
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt ruff mypy
  script:
    - ruff check .
    # Type-check the matrix's own Python version, not mypy.ini's default.
    - mypy --config-file mypy.ini --python-version "$PYTHON_VERSION" -p Cozter
    - python -m unittest discover -s tests
