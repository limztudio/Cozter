name: CI

on:
  push:
    branches: [main]
  pull_request:

# Test jobs only need to read the repository. Keep the workflow token from
# acquiring write access through repository or organization defaults.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Check out into a directory literally named "Cozter" so the package
      # imports as `Cozter` (tests do `from Cozter... import`, matching the
      # README's "run from the parent directory" instructions).
      - uses: actions/checkout@v4
        with:
          path: Cozter
          # Tests never push or fetch private submodules, so don't leave the
          # workflow token in the checkout's git config for later steps.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Cozter/requirements.txt

      - name: Install dependencies
        working-directory: Cozter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff mypy

      - name: Lint (ruff)
        working-directory: Cozter
        run: ruff check .

      - name: Type check (mypy)
        # Run from the parent so the package resolves as `Cozter`, matching
        # the relative imports and the tests' `from Cozter...` layout. Pass
        # the matrix target explicitly because mypy.ini keeps the local
        # lowest-supported-version default for developer runs.
        run: PYTHONPATH="$PWD" mypy --config-file Cozter/mypy.ini --python-version ${{ matrix.python-version }} -p Cozter

      - name: Tests (unittest)
        run: PYTHONPATH="$PWD" python -m unittest discover -s Cozter/tests
