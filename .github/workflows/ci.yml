name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: test jobs never write back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Checkout dir must be named "Cozter" so `from Cozter...` imports resolve.
      - uses: actions/checkout@v4
        with:
          path: Cozter
          # Never push/fetch submodules: keep the workflow token out of git config.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Cozter/requirements.txt

      - name: Install dependencies
        working-directory: Cozter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff mypy

      - name: Lint (ruff)
        working-directory: Cozter
        run: ruff check .

      - name: Type check (mypy)
        # Run from parent so `Cozter` resolves; pass matrix version (mypy.ini defaults locally).
        run: PYTHONPATH="$PWD" mypy --config-file Cozter/mypy.ini --python-version ${{ matrix.python-version }} -p Cozter

      - name: Tests (unittest)
        run: PYTHONPATH="$PWD" python -m unittest discover -s Cozter/tests
