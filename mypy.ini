# Core runtime/backends/tools are type-clean; chat adapters below are
# grandfathered (untyped SDK objects). Type them and delete that block to
# enforce all. `tests/` excluded (monkeypatching trips benign errors).
[mypy]
python_version = 3.11
ignore_missing_imports = True
exclude = (?x)(/tests/|^tests/)

# Chat-platform adapters: untyped Telegram/Slack/Signal SDK objects.
[mypy-Cozter.backends_bot.*]
ignore_errors = True
