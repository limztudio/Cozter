# Local tool configuration. This is intentionally minimal: the project's
# canonical gates (lint/type/test) live in .github/workflows/ci.yml and
# .gitlab-ci.yml. Mypy is configured in mypy.ini; Ruff's explicit rule set
# below preserves the original E4/E7/E9/F lint contract as Ruff evolves.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# pytest-asyncio >= 0.24 warns when this is unset, even though no fixture
# here relies on it. Pin the current behavior so the warning stops
# drowning out real test output for local pytest users.
asyncio_default_fixture_loop_scope = "function"
